[project]
name = "bigbrain"
version = "0.1.0"
description = "BigBrain: AI-agent-mediated shopping over real Shopify stores (prototype)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Moshi (BigBrain Inc.)" }]
# Stack matches BIGBRAIN_SPEC.md §3. Change only with an ADR in docs/DECISIONS.md.
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pynacl>=1.6.2",
    "respx>=0.23.1",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "vcrpy>=8.3.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigbrain"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
markers = [
    "live: hits real Shopify stores over the network; skipped by default (see CLAUDE.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bigbrain"]
